<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гора Пильная - Подробности</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet>
    <style>
        /* Добавляем стили карусели перед существующими стилями */
        .photo-carousel {
            position: relative;
            margin: 20px 0;
        }

        .main-image-container {
            position: relative;
            width: 100%;
            max-height: 500px;
            overflow: hidden;
            border-radius: 8px;
            background: var(--map-bg);
        }

        .main-image {
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .thumbnail-container {
            display: flex;
            gap: 10px;
            padding: 15px 0;
            overflow-x: auto;
        }

        .thumbnail-item {
            position: relative;
            flex: 0 0 120px;
            height: 80px;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .thumbnail-item.active {
            border-color: var(--accent-color);
        }

        .thumbnail-item:hover {
            transform: scale(1.05);
        }

        .thumbnail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s ease;
            z-index: 100;
        }

        .carousel-button:hover {
            background: rgba(0,0,0,0.7);
        }

        .carousel-prev {
            left: 20px;
        }

        .carousel-next {
            right: 20px;
        }

        /* Оригинальные стили ниже - НЕ МЕНЯЕМ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        /* ... (все остальные оригинальные стили остаются без изменений) ... */
    </style>
</head>
<body>

    <!-- Шапка без изменений -->
    <header>...</header>

    <!-- Заменяем старую галерею на новую карусель -->
    <div class="place-details">
        <h1>Гора Пильная</h1>
        <p>Эта величественная гора...</p>

        <!-- Новая карусель -->
        <div class="photo-carousel">
            <div class="main-image-container">
                <img src="https://media-cdn.tripadvisor.com/media/photo-s/06/7f/21/0d/caption.jpg" 
                     class="main-image" 
                     alt="Гора Пильная"
                     id="mainImage">
                <button class="carousel-button carousel-prev">❮</button>
                <button class="carousel-button carousel-next">❯</button>
            </div>
            
            <div class="thumbnail-container">
                <!-- Миниатюры -->
                <div class="thumbnail-item active">
                    <img src="https://media-cdn.tripadvisor.com/media/photo-s/06/7f/21/0d/caption.jpg" 
                         class="thumbnail-image" 
                         data-fullsize="https://media-cdn.tripadvisor.com/media/photo-s/06/7f/21/0d/caption.jpg"
                         alt="Миниатюра 1">
                </div>
                <!-- Добавьте остальные миниатюры -->
            </div>
        </div>

        <!-- Остальной контент без изменений -->
        <div class="map">...</div>
        <div class="reviews">...</div>
    </div>

    <!-- Футер без изменений -->
    <div class="footer">...</div>

    <!-- Добавляем скрипт карусели перед закрывающим тегом body -->
    <script>
        // Карусель фотографий
        const initCarousel = () => {
            const mainImage = document.getElementById('mainImage');
            const thumbnails = document.querySelectorAll('.thumbnail-item');
            const prevButton = document.querySelector('.carousel-prev');
            const nextButton = document.querySelector('.carousel-next');
            let currentIndex = 0;

            const updateMainImage = (index) => {
                const newSrc = thumbnails[index].querySelector('img').dataset.fullsize;
                mainImage.style.opacity = 0;
                
                setTimeout(() => {
                    mainImage.src = newSrc;
                    mainImage.style.opacity = 1;
                }, 300);

                thumbnails.forEach(thumb => thumb.classList.remove('active'));
                thumbnails[index].classList.add('active');
            };

            thumbnails.forEach((thumb, index) => {
                thumb.addEventListener('click', () => {
                    currentIndex = index;
                    updateMainImage(currentIndex);
                });
            });

            prevButton.addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + thumbnails.length) % thumbnails.length;
                updateMainImage(currentIndex);
            });

            nextButton.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % thumbnails.length;
                updateMainImage(currentIndex);
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevButton.click();
                if (e.key === 'ArrowRight') nextButton.click();
            });
        };

        // Инициализируем карусель после загрузки страницы
        window.addEventListener('DOMContentLoaded', initCarousel);
    </script>

    <!-- Оригинальные скрипты остаются без изменений -->
    <script>
        // Существующий код переключения тем и поиска...
    </script>
</body>
</html>
