<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с переключением темы</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Основные стили */
        :root {
            --bg-color: #FFFFFF;
            --text-color: #000000;
            --footer-bg: #F1F1F1;
            --footer-text: #000000;
            --button-bg: #E0E0E0;
            --button-hover: #D0D0D0;
            --icon-color: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A3D;
            --text-color: #FFFFFF;
            --footer-bg: #1A1A3D;
            --footer-text: #FFFFFF;
            --button-bg: #333366;
            --button-hover: #4B4BE6;
            --icon-color: #FFFFFF;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--footer-bg);
        }

        .theme-toggle-btn {
            padding: 10px 15px;
            background-color: var(--button-bg);
            border: none;
            border-radius: 5px;
            color: var(--text-color);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .theme-toggle-btn:hover {
            background-color: var(--button-hover);
        }

        /* Footer стили */
        footer {
            background-color: var(--footer-bg);
            color: var(--footer-text);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-section h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin: 5px 0;
        }

        .footer-links a {
            color: var(--footer-text);
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-icons {
            display: flex;
            gap: 15px;
        }

        .footer-icons a {
            text-decoration: none;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--button-bg);
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .footer-icons a:hover {
            background-color: var(--button-hover);
        }

        .footer-icons img {
            width: 18px;
            height: 18px;
            filter: invert(100%);
        }
    </style>
</head>
<body>

    <!-- Header с кнопкой переключения темы -->
    <header>
        <h1>Переключение темы</h1>
        <button class="theme-toggle-btn" id="themeToggle">Тёмная тема</button>
    </header>

    <!-- Footer -->
    <footer>
        <!-- Первая колонка -->
        <div class="footer-section">
            <h3>Связаться с нами</h3>
            <ul class="footer-links">
                <li><a href="https://example.com/support" target="_blank">Поддержка клиентов</a></li>
                <li><a href="https://example.com/b2b" target="_blank">B2B сотрудничество</a></li>
            </ul>
        </div>

        <!-- Вторая колонка -->
        <div class="footer-section">
            <h3>Наши медиа с полезным контентом:</h3>
            <div class="footer-icons">
                <a href="https://t.me/example" target="_blank">
                    <img src="telegram-icon.png" alt="Telegram">
                </a>
                <a href="https://vk.com/example" target="_blank">
                    <img src="vk-icon.png" alt="VK">
                </a>
                <a href="https://dzen.ru/example" target="_blank">
                    <img src="dzen-icon.png" alt="Dzen">
                </a>
                <a href="https://youtube.com/example" target="_blank">
                    <img src="youtube-icon.png" alt="YouTube">
                </a>
                <a href="https://dtf.ru/example" target="_blank">
                    <img src="dtf-icon.png" alt="DTF">
                </a>
                <a href="https://twitch.tv/example" target="_blank">
                    <img src="twitch-icon.png" alt="Twitch">
                </a>
            </div>
        </div>
    </footer>

    <script>
        // Переключение темы
        const themeToggleButton = document.getElementById('themeToggle');
        const body = document.body;

        themeToggleButton.addEventListener('click', () => {
            const isDarkMode = body.getAttribute('data-theme') === 'dark';
            if (isDarkMode) {
                body.setAttribute('data-theme', 'light');
                themeToggleButton.textContent = 'Тёмная тема';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggleButton.textContent = 'Светлая тема';
            }
        });

        // Установка сохранённой темы (если есть)
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            body.setAttribute('data-theme', savedTheme);
            themeToggleButton.textContent = savedTheme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
        }

        // Сохранение выбранной темы
        themeToggleButton.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            localStorage.setItem('theme', currentTheme);
        });
    </script>
</body>
</html>
