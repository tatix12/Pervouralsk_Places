<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример Footer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        /* Основной footer */
        footer {
            background-color: #1A1A3D; /* Темно-синий цвет */
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-section h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 500;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin: 5px 0;
        }

        .footer-links a {
            color: #FFF;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-icons {
            display: flex;
            gap: 15px;
        }

        .footer-icons a {
            text-decoration: none;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333366; /* Темный оттенок для кнопок */
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .footer-icons a:hover {
            background-color: #4B4BE6; /* Синий цвет при наведении */
        }

        .footer-icons img {
            width: 18px;
            height: 18px;
            filter: invert(100%);
        }
    </style>
</head>
<body>

    <!-- Footer -->
    <footer>
        <!-- Первая колонка -->
        <div class="footer-section">
            <h3>Связаться с нами</h3>
            <ul class="footer-links">
                <li><a href="https://example.com/support" target="_blank">Поддержка клиентов</a></li>
                <li><a href="https://example.com/b2b" target="_blank">B2B сотрудничество</a></li>
            </ul>
        </div>

        <!-- Вторая колонка -->
        <div class="footer-section">
            <h3>Наши медиа с полезным контентом:</h3>
            <div class="footer-icons">
                <a href="https://t.me/example" target="_blank">
                    <img src="telegram-icon.png" alt="Telegram">
                </a>
                <a href="https://vk.com/example" target="_blank">
                    <img src="vk-icon.png" alt="VK">
                </a>
                <a href="https://dzen.ru/example" target="_blank">
                    <img src="dzen-icon.png" alt="Dzen">
                </a>
                <a href="https://youtube.com/example" target="_blank">
                    <img src="youtube-icon.png" alt="YouTube">
                </a>
                <a href="https://dtf.ru/example" target="_blank">
                    <img src="dtf-icon.png" alt="DTF">
                </a>
                <a href="https://twitch.tv/example" target="_blank">
                    <img src="twitch-icon.png" alt="Twitch">
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
